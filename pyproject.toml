[project]
name = "netops-automation"
version = "0.1.0"
description = "Offline network equipment automation service"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
]

[project.scripts]
netops-worker = "netops_automation.app.worker:main"
netops-scheduler = "netops_automation.app.scheduler:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

